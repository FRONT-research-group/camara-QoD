services:
  nef-qos:
    image: ghcr.io/front-research-group/nef-qos:latest
    container_name: nef-qos
    restart: unless-stopped
    environment:
      # App configuration
      NEF_BASE_URL: "http://localhost:8001"
      PCF_BASE_URL: "10.220.2.73"
      PCF_PORT: "8086"

      # Define QoS profiles via environment variables
      QOS_MAPPING: >
        {
          "QOS_E": {"marBwDl": "5 Mbps", "marBwUl": "5 Mbps", "mirBwDl": "2 Mbps", "mirBwUl": "2 Mbps", "mediaType": "VIDEO"},
          "QOS_L": {"marBwDl": "35 Mbps", "marBwUl": "18 Mbps", "mirBwDl": "25 Mbps", "mirBwUl": "15 Mbps", "mediaType": "VIDEO"},
          "QOS_M": {"marBwDl": "20 Mbps", "marBwUl": "10 Mbps", "mirBwDl": "15 Mbps", "mirBwUl": "5 Mbps", "mediaType": "VIDEO"},
          "QOS_S": {"marBwDl": "15 Mbps", "marBwUl": "10 Mbps", "mirBwDl": "10 Mbps", "mirBwUl": "5 Mbps", "mediaType": "VIDEO"}
        }
    ports:
      - "8585:8001"  

  camara-qod:
    image: ghcr.io/front-research-group/camara-qod:latest
    container_name: camara-qod
    restart: unless-stopped
    environment:
      ASSESSIONWITHQOS_URL: "http://nef-qos:8001/3gpp-as-session-with-qos/v1"
      LOG_LEVEL: "DEBUG"
    depends_on:
      - nef-qos
    ports:
      - "8584:8002" 
